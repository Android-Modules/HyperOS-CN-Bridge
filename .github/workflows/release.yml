name: Build Songyuan Module

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test ROM input validation
        run: python3 -m unittest discover -s songyuan/tools -p test_rom_inputs.py

      - name: Read locked ROM asset
        id: inputs
        run: |
          python3 - <<'PY'
          import json, os
          lock = json.load(open('songyuan/rom-inputs.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key in ('repository', 'release', 'asset'):
                  value = lock[key]
                  assert '\n' not in value and '\r' not in value
                  print(f'{key}={value}', file=out)
          PY

      - name: Download and verify original ROM inputs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REPOSITORY: ${{ steps.inputs.outputs.repository }}
          INPUT_RELEASE: ${{ steps.inputs.outputs.release }}
          INPUT_ASSET: ${{ steps.inputs.outputs.asset }}
        run: |
          gh release download "$INPUT_RELEASE" --repo "$INPUT_REPOSITORY" --pattern "$INPUT_ASSET" --dir "$RUNNER_TEMP/rom-inputs"
          python3 songyuan/tools/rom_inputs.py extract --archive "$RUNNER_TEMP/rom-inputs/$INPUT_ASSET"

      - name: Build full module and verify APK signatures and hashes
        run: python3 songyuan/tools/build.py

      - name: Test WebUI
        run: |
          npm install --prefix "$RUNNER_TEMP/webui-test" --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/webui-test/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/webui-test/node_modules/playwright/index.mjs" node songyuan/tools/test_webui.mjs

      - name: Record build provenance
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lock = json.loads(Path('songyuan/rom-inputs.lock.json').read_text())
          record = {'commit': os.environ['BUILD_SHA'], 'run': os.environ['BUILD_URL'],
                    'romArchiveSHA256': lock['sha256'], 'source': lock['source'], 'target': lock['target'],
                    'module': Path('songyuan/module/module.prop').read_text()}
          Path('dist/build-info.json').write_text(json.dumps(record, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              print('### HyperOS CN Bridge — songyuan\n', file=out)
              print('Full build: 19 features, 31 packages, 41 original CN APKs + Global clock fallback.\n', file=out)
              print('```\n' + Path('dist/songyuan-cn-complete-OS3.0.306.0.zip.sha256').read_text() + '```', file=out)
          PY

      - name: Upload module, checksums and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: HyperOS-CN-Bridge-songyuan-${{ github.run_number }}
          path: |
            dist/songyuan-cn-complete-OS3.0.306.0.zip
            dist/songyuan-cn-complete-OS3.0.306.0.zip.sha256
            dist/sources-complete.json
            dist/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
