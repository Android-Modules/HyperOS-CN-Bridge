name: Build Device Modules

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [songyuan, ishtar]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Test ROM input validation
        run: python3 -m unittest discover -s songyuan/tools -p test_rom_inputs.py

      - name: Read locked ROM asset
        id: inputs
        run: |
          python3 - <<'PY'
          import json, os
          lock = json.load(open('${{ matrix.device }}/rom-inputs.lock.json'))
          lock = lock.get('archive', lock)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key in ('repository', 'release', 'asset'):
                  value = lock[key]
                  assert '\n' not in value and '\r' not in value
                  print(f'{key}={value}', file=out)
          PY

      - name: Download and verify original ROM inputs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REPOSITORY: ${{ steps.inputs.outputs.repository }}
          INPUT_RELEASE: ${{ steps.inputs.outputs.release }}
          INPUT_ASSET: ${{ steps.inputs.outputs.asset }}
        run: |
          gh release download "$INPUT_RELEASE" --repo "$INPUT_REPOSITORY" --pattern "$INPUT_ASSET" --dir "$RUNNER_TEMP/rom-inputs"
          python3 ${{ matrix.device }}/tools/rom_inputs.py extract --archive "$RUNNER_TEMP/rom-inputs/$INPUT_ASSET"

      - name: Build signed ishtar companion
        if: matrix.device == 'ishtar'
        env:
          CNBRIDGE_SIGNING_KEY: ${{ secrets.CNBRIDGE_SIGNING_KEY }}
          CNBRIDGE_KEYSTORE: ${{ runner.temp }}/cnbridge-signing.jks
        run: |
          python3 - <<'PYKEY'
          import base64, os
          from pathlib import Path
          key = os.environ['CNBRIDGE_SIGNING_KEY']
          if not key:
              raise SystemExit('Missing repository secret CNBRIDGE_SIGNING_KEY')
          path = Path(os.environ['CNBRIDGE_KEYSTORE'])
          path.write_bytes(base64.b64decode(key, validate=True))
          path.chmod(0o600)
          PYKEY
          python3 ishtar/companion/build.py

      - name: Remove temporary signing key
        if: always() && matrix.device == 'ishtar'
        run: python3 -c "from pathlib import Path; Path('${{ runner.temp }}/cnbridge-signing.jks').unlink(missing_ok=True)"

      - name: Build full module and verify APK signatures and hashes
        run: python3 ${{ matrix.device }}/tools/build.py

      - name: Test WebUI
        run: |
          npm install --prefix "$RUNNER_TEMP/webui-test" --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/webui-test/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/webui-test/node_modules/playwright/index.mjs" node ${{ matrix.device }}/tools/test_webui.mjs

      - name: Record build provenance
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          device = '${{ matrix.device }}'
          lock = json.loads(Path(f'{device}/rom-inputs.lock.json').read_text())
          archive = lock.get('archive', lock)
          record = {'device': device, 'commit': os.environ['BUILD_SHA'], 'run': os.environ['BUILD_URL'],
                    'romArchiveSHA256': archive['sha256'], 'source': lock['source'],
                    'module': Path(f'{device}/module/module.prop').read_text()}
          if device == 'ishtar':
              record['companion'] = json.loads(Path('ishtar/companion/version.json').read_text())
          Path('dist/build-info.json').write_text(json.dumps(record, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              print(f'### HyperOS CN Bridge — {device}\n', file=out)
              print('```', file=out)
              for checksum in sorted(Path('dist').glob('*.sha256')):
                  print(checksum.read_text().strip(), file=out)
              print('```', file=out)
          PY

      - name: Upload module, checksums and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: HyperOS-CN-Bridge-${{ matrix.device }}-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.apk
            dist/sources-complete.json
            dist/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
